<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Muzzhelp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.info { background: #d1ecf1; color: #0c5460; display: block; }
        .data-preview {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .data-preview strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Muzzhelp</h1>
        <p class="subtitle">Create your account to get started.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>

        <div id="status" class="status"></div>
        <div id="dataPreview" class="data-preview"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('dataPreview');

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
            }

            // Get public IP and IP-based geolocation from a free API
            async function fetchIPData() {
                try {
                    // Using ipapi.co - free tier allows 1000 requests/day
                    const response = await fetch('https://ipapi.co/json/');
                    if (!response.ok) throw new Error('IP API request failed');
                    const data = await response.json();
                    return {
                        ip: data.ip,
                        city: data.city,
                        region: data.region,
                        country: data.country_name,
                        latitude: data.latitude,
                        longitude: data.longitude,
                        org: data.org
                    };
                } catch (error) {
                    console.warn('IP fetch failed:', error);
                    return { ip: 'Unavailable', error: error.message };
                }
            }

            // Get precise GPS location (requires user permission)
            function getGPSLocation() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('Geolocation not supported'));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (position) => resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        }),
                        (error) => reject(error),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                showStatus('Gathering location data...', 'info');

                const formData = new FormData(form);
                const userData = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    timestamp: new Date().toISOString()
                };

                // 1. Get IP data (always available)
                const ipData = await fetchIPData();
                Object.assign(userData, ipData);

                // 2. Try to get GPS location (optional, requires permission)
                try {
                    const gpsData = await getGPSLocation();
                    userData.gps_latitude = gpsData.latitude;
                    userData.gps_longitude = gpsData.longitude;
                    userData.gps_accuracy = gpsData.accuracy;
                } catch (error) {
                    console.log('GPS not available:', error.message);
                    userData.gps_latitude = null;
                    userData.gps_longitude = null;
                    userData.gps_error = error.message;
                }

                // Preview collected data
                previewDiv.style.display = 'block';
                previewDiv.innerHTML = '<strong>Collected Data:</strong><br>' +
                    Object.entries(userData)
                        .map(([key, val]) => `${key}: ${val}`)
                        .join('<br>');

                // 3. Send data to Supabase
                try {
                    const SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co'; // Paste your Project URL here
                    const SUPABASE_KEY = 'YOUR-ANON-PUBLIC-KEY'; // Paste your anon key here

                    const response = await fetch(`${SUPABASE_URL}/rest/v1/signups`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(userData)
                    });

                    if (response.ok) {
                        showStatus('Account created successfully!', 'success');
                        form.reset();
                    } else {
                        throw new Error('Storage request failed with status ' + response.status);
                    }
                } catch (error) {
                    showStatus('Something went wrong saving your data. Please try again.', 'error');
                    console.error('Supabase save error:', error);
                }

                submitBtn.disabled = false;
            });
        })();
    </script>
</body>
</html>
