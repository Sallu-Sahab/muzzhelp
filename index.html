<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Muzzhelp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.info { background: #d1ecf1; color: #0c5460; display: block; }
        .data-preview {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .data-preview strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Muzzhelp</h1>
        <p class="subtitle">Create your account to get started.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>

        <div id="status" class="status"></div>
        <div id="dataPreview" class="data-preview"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('dataPreview');

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
            }

        // Fetch public IP and geolocation details using ipwho.is (CORS enabled)
async function fetchIPData() {
    try {
        const response = await fetch('https://ipwho.is/');
        if (!response.ok) throw new Error('IP API request failed');
        const data = await response.json();

        if (!data.success) throw new Error(data.message || 'Location fetch failed');

        return {
            ip: data.ip || null,
            city: data.city || null,
            region: data.region || null,
            country: data.country || null,
            latitude: typeof data.latitude === 'number' ? data.latitude : null,
            longitude: typeof data.longitude === 'number' ? data.longitude : null,
            org: data.connection?.org || data.connection?.isp || null
        };
    } catch (error) {
        console.warn('IP fetch failed, falling back to ipify:', error);
        
        // Fallback to get IP if primary geo API fails
        try {
            const fallbackRes = await fetch('https://api.ipify.org?format=json');
            const fallbackData = await fallbackRes.json();
            return { ip: fallbackData.ip || null };
        } catch (e) {
            return {};
        }
    }
}

            // Fetch high-accuracy GPS coordinates
            function getGPSLocation() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        resolve({});
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (position) => resolve({
                            gps_latitude: position.coords.latitude,
                            gps_longitude: position.coords.longitude,
                            gps_accuracy: position.coords.accuracy
                        }),
                        (error) => {
                            console.log('GPS unavailable or permission denied:', error.message);
                            resolve({});
                        },
                        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                    );
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                showStatus('Gathering location data...', 'info');

                const formData = new FormData(form);
                const userData = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    timestamp: new Date().toISOString()
                };

                // Retrieve IP & GPS payload properties
                const ipData = await fetchIPData();
                const gpsData = await getGPSLocation();

                Object.assign(userData, ipData, gpsData);

                // Show payload in preview box
                previewDiv.style.display = 'block';
                previewDiv.innerHTML = '<strong>Collected Data:</strong><br>' +
                    Object.entries(userData)
                        .map(([key, val]) => `${key}: ${val}`)
                        .join('<br>');

                // Send payload to Supabase Database API
                try {
                    const SUPABASE_URL = 'https://waqbujfkoqhuixeahzta.supabase.co';
                    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhcWJ1amZrb3FodWl4ZWFoenRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUyMzksImV4cCI6MjEwNTI0MTIzOX0.slUkwBTlAIzYUAdTqbxs-6SPiq03AIXtWKuzAf-SxoE';

                    const response = await fetch(`${SUPABASE_URL}/rest/v1/signups`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(userData)
                    });

                    if (response.ok) {
                        showStatus('Account created successfully!', 'success');
                        form.reset();
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        console.error('Supabase Error Details:', errorData);
                        showStatus(`Error (${response.status}): ${errorData.message || 'Failed to save data. Check table columns or RLS policies.'}`, 'error');
                    }
                } catch (error) {
                    showStatus('Network error while saving data. Please check your connection.', 'error');
                    console.error('Fetch error:', error);
                }

                submitBtn.disabled = false;
            });
        })();
    </script>
</body>
</html>
